<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Quiz — Orden en ℝ</title>

<style>
body{
margin:0;
background:#0b1220;
color:#eaf0ff;
font-family:system-ui;
}
.container{
width:min(1000px,92vw);
margin:30px auto;
}
.card{
background:#111a2e;
padding:25px;
border-radius:18px;
}
#ggb1{
width:100%;
height:360px;
border-radius:14px;
overflow:hidden;
}
.quiz{
margin-top:20px;
}
.optionBtn{
display:block;
width:100%;
margin:8px 0;
padding:10px;
border-radius:12px;
background:#1b2540;
border:none;
color:white;
cursor:pointer;
text-align:left;
}
.optionBtn:hover{
background:#273567;
}
.feedback{
margin-top:10px;
padding:10px;
border-radius:12px;
background:#1b2540;
}
.correct{background:#1f5f3a !important;}
.wrong{background:#7a2f2f !important;}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h2>Bloque 1 — Orden en ℝ</h2>
<p>Mueve los puntos A y B sobre la recta.</p>

<div id="ggb1"></div>

<div class="quiz">
<p>Si A está a la izquierda de B, entonces \(b-a\) es:</p>

<button class="optionBtn" data-answer="neg">A) Negativo</button>
<button class="optionBtn" data-answer="cero">B) Cero</button>
<button class="optionBtn" data-answer="pos">C) Positivo</button>

<div id="feedback" class="feedback">
Arrastra los puntos y luego responde.
</div>

</div>
</div>
</div>

<script src="https://www.geogebra.org/apps/deployggb.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function(){

const params = {
appName: "graphing",
width: 1000,
height: 360,
showToolBar: false,
showAlgebraInput: false,
showMenuBar: false,
showZoomButtons: false,
enableShiftDragZoom: false,
enableRightClick: false,
useBrowserForJS: true,

appletOnLoad: function(api){

window.ggb = api;

api.setCoordSystem(-8,8,-1,3);
api.evalCommand("ShowGrid(false)");
api.evalCommand("SetAxisVisible(0,true)");
api.evalCommand("SetAxisVisible(1,false)");

api.evalCommand("A=(-2,0)");
api.evalCommand("B=(2,0)");

api.evalCommand("SetPointSize(A,6)");
api.evalCommand("SetPointSize(B,6)");

api.evalCommand("SetColor(A,255,120,120)");
api.evalCommand("SetColor(B,120,255,150)");

api.evalCommand("SetFixed(A,false)");
api.evalCommand("SetFixed(B,false)");

api.evalCommand("SetPointStyle(A,0)");
api.evalCommand("SetPointStyle(B,0)");

api.evalCommand("Segment(A,B)");
}
};

setTimeout(function(){
let app = new GGBApplet(params,true);
app.inject("ggb1");
},100);

const feedback = document.getElementById("feedback");

document.querySelectorAll(".optionBtn").forEach(btn=>{
btn.addEventListener("click", function(){

let ax = ggb.getXcoord("A");
let bx = ggb.getXcoord("B");

let correct;
if(Math.abs(ax-bx)<1e-9) correct="cero";
else if(ax<bx) correct="pos";
else correct="neg";

document.querySelectorAll(".optionBtn").forEach(b=>{
b.classList.remove("correct","wrong");
});

if(btn.dataset.answer===correct){
btn.classList.add("correct");
feedback.innerHTML="Correcto ✔";
}
else{
btn.classList.add("wrong");
feedback.innerHTML="Incorrecto. Recuerda: si A está a la izquierda, entonces B−A es positivo.";
}

});
});

});
</script>

</body>
</html>
