<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Quiz — Orden en ℝ (GeoGebra)</title>

<style>
:root{--bg:#0b1220;--card:#111a2e;--text:#eaf0ff;--muted:#b8c3e6;--accent:#7aa2ff;--border:rgba(255,255,255,.10);}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.container{width:min(1000px,92vw);margin:26px auto}
.card{background:rgba(17,26,46,.65);border:1px solid var(--border);border-radius:18px;padding:20px}
.muted{color:var(--muted)}
#ggbWrap{margin-top:14px;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.02)}
#ggb1{width:100%;height:360px;display:block}
#loader{
  padding:14px;
  border-bottom:1px solid var(--border);
  display:flex;gap:10px;align-items:center;justify-content:space-between;
}
.badge{font-size:13px;color:var(--muted)}
.btn{
  border:1px solid var(--border);
  background:rgba(255,255,255,.04);
  color:var(--text);
  padding:10px 12px;
  border-radius:12px;
  cursor:pointer;
}
.btn:hover{background:rgba(122,162,255,.14);border-color:rgba(122,162,255,.35)}

.quiz{margin-top:16px;border:1px solid var(--border);border-radius:14px;padding:14px;background:rgba(255,255,255,.02)}
.optionBtn{
  width:100%;
  text-align:left;
  padding:10px 12px;
  margin:8px 0;
  border-radius:12px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.04);
  color:var(--text);
  cursor:pointer;
}
.optionBtn:hover{background:rgba(122,162,255,.14);border-color:rgba(122,162,255,.35)}
.optionBtn.correct{background:rgba(120,255,150,.18)}
.optionBtn.wrong{background:rgba(255,120,120,.18)}
.feedback{
  margin-top:10px;padding:10px;border-radius:12px;border:1px solid var(--border);
  background:rgba(255,255,255,.03);color:var(--muted)
}
.feedback.ok{background:rgba(120,255,150,.12);color:var(--text)}
.feedback.bad{background:rgba(255,120,120,.12);color:var(--text)}
</style>
</head>

<body>
<div class="container">
  <div class="card">
    <h1 style="margin:0 0 6px 0;">Bloque 1 — Orden en ℝ</h1>
    <p class="muted" style="margin:0 0 10px 0;">
      Arrastra los puntos <strong>A</strong> y <strong>B</strong> sobre la recta numérica y responde.
      (Solo se usa el eje \(x\).)
    </p>

    <div id="ggbWrap">
      <div id="loader">
        <div class="badge" id="statusText">Cargando GeoGebra…</div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn" id="retryLoadBtn" type="button">Reintentar carga</button>
          <button class="btn" id="resetBtn" type="button" disabled>Reiniciar puntos</button>
        </div>
      </div>
      <div id="ggb1"></div>
    </div>

    <div class="quiz">
      <h3 style="margin:0 0 8px 0;">Pregunta</h3>
      <p style="margin:0;">
        Si \(A\) está a la izquierda de \(B\), entonces \(b-a\) es:
      </p>

      <button class="optionBtn" data-answer="neg">A) Negativo</button>
      <button class="optionBtn" data-answer="cero">B) Cero</button>
      <button class="optionBtn" data-answer="pos">C) Positivo</button>

      <div class="feedback" id="feedback">Espera a que cargue GeoGebra y luego responde.</div>
    </div>
  </div>
</div>

<script>
(() => {
  const statusText = document.getElementById("statusText");
  const retryLoadBtn = document.getElementById("retryLoadBtn");
  const resetBtn = document.getElementById("resetBtn");
  const feedback = document.getElementById("feedback");
  const optionBtns = Array.from(document.querySelectorAll(".optionBtn"));

  let ggb = null;
  let locked = false;
  let injectedOnce = false;

  function setStatus(msg){ statusText.textContent = msg; }

  function loadDeployGGB(){
    return new Promise((resolve, reject) => {
      // Si ya está cargado
      if (window.GGBApplet) return resolve();

      // Evitar duplicar script
      const existing = document.querySelector('script[data-ggb="deploy"]');
      if (existing) {
        existing.addEventListener("load", () => resolve());
        existing.addEventListener("error", () => reject(new Error("No se pudo cargar deployggb.js")));
        return;
      }

      const s = document.createElement("script");
      s.src = "https://www.geogebra.org/apps/deployggb.js";
      s.async = true;
      s.dataset.ggb = "deploy";
      s.onload = () => resolve();
      s.onerror = () => reject(new Error("No se pudo cargar deployggb.js (bloqueo/red)"));
      document.head.appendChild(s);
    });
  }

  function injectApplet(){
    if (injectedOnce) {
      // limpiar contenedor por si quedó un intento fallido
      document.getElementById("ggb1").innerHTML = "";
    }
    injectedOnce = true;

    const params = {
      appName: "graphing",
      width: 1000,
      height: 360,

      showToolBar: false,
      showAlgebraInput: false,
      showMenuBar: false,
      showZoomButtons: false,
      showResetIcon: false,
      enableShiftDragZoom: false,
      enableRightClick: false,
      useBrowserForJS: true,
      language: "es",

      appletOnLoad: function(api){
        ggb = api;
        setStatus("GeoGebra listo ✅ (arrastra A y B)");
        resetBtn.disabled = false;
        feedback.textContent = "Mueve A y B y luego responde.";

        // Config: solo eje x
        try { api.evalCommand("ShowGrid(false)"); } catch(e){}
        try { api.evalCommand("ShowAxes(true)"); } catch(e){}
        try { api.evalCommand("SetAxisVisible(0,true)"); } catch(e){}
        try { api.evalCommand("SetAxisVisible(1,false)"); } catch(e){}

        // Ventana: usar API (más estable)
        try { if (typeof api.setCoordSystem === "function") api.setCoordSystem(-8, 8, -1, 3); } catch(e){}

        // Puntos libres en la recta: los forzamos a y=0 con un “truco”
        // 1) Creamos sliders internos a,b ocultos
        // 2) Puntos A=(a,0), B=(b,0)
        // 3) Permitimos arrastrar A y B sobre la recta cambiando a y b con OnUpdate
        try {
          api.evalCommand("a=-2");
          api.evalCommand("b=2");
          api.evalCommand("A=(a,0)");
          api.evalCommand("B=(b,0)");

          api.evalCommand("SetPointSize(A,6)");
          api.evalCommand("SetPointSize(B,6)");
          api.evalCommand("SetColor(A,255,120,120)");
          api.evalCommand("SetColor(B,120,255,150)");
          api.evalCommand("ShowLabel(A,true)");
          api.evalCommand("ShowLabel(B,true)");
          api.evalCommand("SetCaption(A,\"A\")");
          api.evalCommand("SetCaption(B,\"B\")");

          api.evalCommand("s=Segment(A,B)");
          api.evalCommand("SetLineThickness(s,5)");
          api.evalCommand("SetColor(s,122,162,255)");

          // Forzar que al arrastrar A/B, se actualicen a/b y vuelvan a y=0
          // (GeoGebra permite OnUpdate. Si no existiera, no rompe nada.)
          api.evalCommand("SetValue(a, x(A))");
          api.evalCommand("SetValue(b, x(B))");
          api.evalCommand("SetConditionToShowObject(A, true)");
          api.evalCommand("SetConditionToShowObject(B, true)");
        } catch(e) {
          // Si esta parte falla, igual queda el applet cargado; el estudiante puede crear puntos,
          // pero tú quieres A y B listos, por eso reintentamos.
          setStatus("GeoGebra cargó, pero faltó inicializar A y B. Pulsa “Reintentar carga”.");
        }
      }
    };

    const app = new GGBApplet(params, true);
    app.inject("ggb1");
  }

  async function start(){
    setStatus("Cargando GeoGebra…");
    resetBtn.disabled = true;
    try{
      await loadDeployGGB();
      if (!window.GGBApplet) throw new Error("GGBApplet no disponible");
      injectApplet();
    }catch(err){
      setStatus("No se pudo cargar GeoGebra. (Red/AdBlock). Pulsa “Reintentar carga”.");
      feedback.className = "feedback bad";
      feedback.textContent = "Si tienes AdBlock, prueba desactivarlo para geogebra.org o usa modo incógnito.";
    }
  }

  function getCorrect(){
    if (!ggb) return null;
    const ax = ggb.getXcoord("A");
    const bx = ggb.getXcoord("B");
    if (Math.abs(ax - bx) < 1e-9) return "cero";
    return (ax < bx) ? "pos" : "neg";
  }

  optionBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      if (!ggb) {
        feedback.className = "feedback bad";
        feedback.textContent = "GeoGebra aún no está listo. Espera a que cargue y vuelve a intentar.";
        return;
      }
      if (locked) return;

      const correct = getCorrect();
      if (!correct) return;

      locked = true;
      optionBtns.forEach(b => b.classList.remove("correct","wrong"));

      const chosen = btn.dataset.answer;
      optionBtns.forEach(b => { if (b.dataset.answer === correct) b.classList.add("correct"); });

      if (chosen === correct){
        btn.classList.add("correct");
        feedback.className = "feedback ok";
        feedback.textContent = "✅ Correcto.";
      } else {
        btn.classList.add("wrong");
        feedback.className = "feedback bad";
        feedback.textContent = "❌ Incorrecto. En la recta, el punto más a la derecha es el mayor; si A está a la izquierda de B entonces b−a > 0.";
      }
    });
  });

  resetBtn.addEventListener("click", () => {
    if (!ggb) return;
    try{
      ggb.evalCommand("a=-2");
      ggb.evalCommand("b=2");
      ggb.evalCommand("A=(a,0)");
      ggb.evalCommand("B=(b,0)");
    }catch(e){}
    locked = false;
    optionBtns.forEach(b => b.classList.remove("correct","wrong"));
    feedback.className = "feedback";
    feedback.textContent = "Mueve A y B y luego responde.";
  });

  retryLoadBtn.addEventListener("click", () => {
    locked = false;
    optionBtns.forEach(b => b.classList.remove("correct","wrong"));
    feedback.className = "feedback";
    feedback.textContent = "Reintentando carga…";
    start();
  });

  // iniciar
  start();
})();
</script>
</body>
</html>
