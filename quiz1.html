<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recta interactiva</title>
<style>
    body {
        font-family: Arial;
        text-align: center;
        background: #f5f5f5;
    }
    canvas {
        background: white;
        border: 1px solid #ccc;
    }
    .controls {
        margin-top: 10px;
    }
</style>
</head>
<body>

<h2>Explora la recta y = mx + 3</h2>

<canvas id="canvas" width="500" height="500"></canvas>

<div class="controls">
    <label>m = <span id="valorM">1</span></label><br>
    <input type="range" id="sliderM" min="-4" max="4" step="0.1" value="1">
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const slider = document.getElementById("sliderM");
const valorM = document.getElementById("valorM");

const escala = 40; // píxeles por unidad
const centroX = canvas.width / 2;
const centroY = canvas.height / 2;

// Dibujar ejes
function dibujarEjes() {
    ctx.strokeStyle = "#aaa";
    ctx.lineWidth = 1;

    // Eje X
    ctx.beginPath();
    ctx.moveTo(0, centroY);
    ctx.lineTo(canvas.width, centroY);
    ctx.stroke();

    // Eje Y
    ctx.beginPath();
    ctx.moveTo(centroX, 0);
    ctx.lineTo(centroX, canvas.height);
    ctx.stroke();
}

// Dibujar recta
function dibujarRecta(m) {
    ctx.strokeStyle = "blue";
    ctx.lineWidth = 2;

    ctx.beginPath();

    let xInicio = -10;
    let yInicio = m * xInicio + 3;

    let xFin = 10;
    let yFin = m * xFin + 3;

    ctx.moveTo(
        centroX + xInicio * escala,
        centroY - yInicio * escala
    );

    ctx.lineTo(
        centroX + xFin * escala,
        centroY - yFin * escala
    );

    ctx.stroke();
}

// Dibujar todo
function dibujar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let m = parseFloat(slider.value);
    valorM.textContent = m.toFixed(1);

    dibujarEjes();
    dibujarRecta(m);
}

// Evento del slider
slider.addEventListener("input", dibujar);

// Inicial
dibujar();
</script>

</body>
</html>
