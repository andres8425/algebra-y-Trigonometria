<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recta interactiva</title>
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        text-align: center;
        background: #f0f2f5;
    }

    h2 {
        color: #333;
    }

    canvas {
        background: white;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .controls {
        margin-top: 15px;
        font-size: 18px;
    }

    input[type="range"] {
        width: 300px;
    }
</style>
</head>
<body>

<h2>Explora la recta y = mx + 3</h2>

<canvas id="canvas" width="500" height="500"></canvas>

<div class="controls">
    <label><strong>m = <span id="valorM">1</span></strong></label><br>
    <input type="range" id="sliderM" min="-4" max="4" step="0.1" value="1">
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const slider = document.getElementById("sliderM");
const valorM = document.getElementById("valorM");

const escala = 40;
const centroX = canvas.width / 2;
const centroY = canvas.height / 2;

// Cuadrícula
function dibujarCuadricula() {
    ctx.strokeStyle = "#eee";
    ctx.lineWidth = 1;

    for (let i = -5; i <= 5; i++) {
        // líneas verticales
        ctx.beginPath();
        ctx.moveTo(centroX + i * escala, 0);
        ctx.lineTo(centroX + i * escala, canvas.height);
        ctx.stroke();

        // líneas horizontales
        ctx.beginPath();
        ctx.moveTo(0, centroY + i * escala);
        ctx.lineTo(canvas.width, centroY + i * escala);
        ctx.stroke();
    }
}

// Ejes principales
function dibujarEjes() {
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;

    // eje X
    ctx.beginPath();
    ctx.moveTo(0, centroY);
    ctx.lineTo(canvas.width, centroY);
    ctx.stroke();

    // eje Y
    ctx.beginPath();
    ctx.moveTo(centroX, 0);
    ctx.lineTo(centroX, canvas.height);
    ctx.stroke();
}

// Números en los ejes
function dibujarNumeros() {
    ctx.fillStyle = "#555";
    ctx.font = "12px Arial";

    for (let i = -5; i <= 5; i++) {
        if (i !== 0) {
            // eje X
            ctx.fillText(
                i,
                centroX + i * escala - 5,
                centroY + 15
            );

            // eje Y
            ctx.fillText(
                i,
                centroX - 20,
                centroY - i * escala + 5
            );
        }
    }
}

// Etiquetas x e y
function dibujarEtiquetas() {
    ctx.fillStyle = "#000";
    ctx.font = "bold 14px Arial";

    // x
    ctx.fillText("x", canvas.width - 15, centroY - 10);

    // y
    ctx.fillText("y", centroX + 10, 15);
}

// Recta
function dibujarRecta(m) {
    ctx.strokeStyle = "#007bff";
    ctx.lineWidth = 3;

    ctx.beginPath();

    let xInicio = -10;
    let yInicio = m * xInicio + 3;

    let xFin = 10;
    let yFin = m * xFin + 3;

    ctx.moveTo(
        centroX + xInicio * escala,
        centroY - yInicio * escala
    );

    ctx.lineTo(
        centroX + xFin * escala,
        centroY - yFin * escala
    );

    ctx.stroke();
}

// Dibujar todo
function dibujar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let m = parseFloat(slider.value);
    valorM.textContent = m.toFixed(1);

    dibujarCuadricula();
    dibujarEjes();
    dibujarNumeros();
    dibujarEtiquetas();
    dibujarRecta(m);
}

// Evento
slider.addEventListener("input", dibujar);

// Inicial
dibujar();
</script>

</body>
</html>
